name: Build APK

on:
  workflow_dispatch:

env:
  VERSION_NAME: "1.0.0"   # app version shown to users; change it for big updates

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Check signing secrets
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KK: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KS KP KA KK; do
            if [ -z "${!v}" ]; then echo "::error::GitHub Secret missing (see setup guide): $v"; exit 1; fi
          done

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html style.css script.js APK_Logo_512x512_Transparent.png www/

      - name: Install Capacitor
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Set app logo (APK icon + splash)
        run: |
          pip install pillow
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          python3 make_icons.py APK_Logo_512x512_Transparent.png $RES "#0A2A7A"

      - name: Sync web files
        run: npx cap sync android

      - name: Set version and signing config
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          RUN_NO: ${{ github.run_number }}
        run: |
          echo "$KS" | base64 -d > android/app/release.keystore
          python3 - <<'PY'
          import os,re
          p='android/app/build.gradle'
          s=open(p).read()
          s,n1=re.subn(r'versionCode\s+\d+','versionCode '+os.environ['RUN_NO'],s)
          s,n2=re.subn(r'versionName\s+"[^"]*"','versionName "'+os.environ.get('VERSION_NAME','1.0.0')+'"',s)
          sign='''signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {'''
          i=s.index('buildTypes')
          head,tail=s[:i],s[i:]
          tail,n4=re.subn(r'(release\s*\{)',r'\1\n            signingConfig signingConfigs.release',tail,count=1)
          s=head+sign.replace('buildTypes {','')+tail
          n3=1
          assert n1 and n2 and n3 and n4,(n1,n2,n3,n4)
          open(p,'w').write(s)
          PY

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: smart-cash-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

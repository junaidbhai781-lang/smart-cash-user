name: Build Smart Cash Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify package name
        run: |
          node -e "
          const c = require('./capacitor.config.json');
          if (c.appId !== 'com.smartcash.user1') {
            throw new Error('Unexpected package name: ' + c.appId);
          }
          console.log('Package ID:', c.appId);
          "

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html style.css script.js native.js \
            APK_Logo_512x512_Transparent.png www/

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Set app icons
        run: |
          pip install pillow
          RES=android/app/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26"
          python3 make_icons.py \
            APK_Logo_512x512_Transparent.png "$RES" "#0B1426"

      - name: Sync Android
        run: npx cap sync android

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/release.jks"

          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          export ANDROID_KEY_ALIAS="$KEY_ALIAS"
          export ANDROID_KEY_PASSWORD="$KEY_PASSWORD"

          python3 - <<'PY'
          import os, re
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if "signingConfigs {" not in s:
              s, n = re.subn(
                  r'(?m)^(\s*)buildTypes\s*\{',
                  r'''\1signingConfigs {
          \1    release {
          \1        storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
          \1        storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
          \1        keyAlias System.getenv("ANDROID_KEY_ALIAS")
          \1        keyPassword System.getenv("ANDROID_KEY_PASSWORD")
          \1    }
          \1}

          \1buildTypes {''',
                  s, count=1
              )
              if n != 1:
                  raise SystemExit("Could not configure release signing")
          else:
              raise SystemExit(
                  "Existing signingConfigs found; inspect Gradle before modifying"
              )

          s, n = re.subn(
              r'(?m)^(\s*)release\s*\{',
              r'\1release {\n\1    signingConfig signingConfigs.release',
              s, count=1
          )
          if n != 1:
              raise SystemExit("Could not attach release signing")

          p.write_text(s)
          PY

          rm -f "$RUNNER_TEMP/release.jks"

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" \
            | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK package name
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" \
            -name aapt -type f | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | head -n 1 \
            | grep -F "com.smartcash.user1"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-cash-user-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

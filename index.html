<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Games</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#046a5c">
<meta name="color-scheme" content="dark">
<link rel="icon" href="assets/logo-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/games.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/embed.css">
<link rel="stylesheet" href="css/smartcash-theme.css">
</head>
<body>
<div id="app">

 <!-- HOME (Home + Games tabs live here; Wallet and Profile slide over it as panels) -->
 <div id="homeV" class="hv">
  <header class="hb">
   <img class="av" src="assets/logo-192.png" alt="Super77Pro logo" width="44" height="44">
   <div class="who"><b>Super77Pro</b><small>Guest · ID 000000</small></div>
   <div class="wal">
    <i class="coin" aria-hidden="true"></i>
    <span class="wal-t"><span class="bal" aria-label="Wallet balance">0</span><small>Wallet balance</small></span>
   </div>
  </header>

  <main class="hs">

   <div class="sh"><h3>Games</h3><small>2 tables</small></div>
   <div class="gm">
    <button class="g c2" data-g="wheel" aria-label="Play Super77Pro fruit wheel">
     <img class="lg" src="assets/super77pro.webp" alt="" width="116" height="116">
     <span class="tagline">Wheel</span><h4>Super77Pro</h4><small>Spin the fruit wheel</small><span class="pl">Play</span>
    </button>
    <button class="g c3" data-g="greedy" aria-label="Play GreedyBaby">
     <img class="lg" src="assets/greedybaby.webp" alt="" width="116" height="116">
     <span class="tagline">Food</span><h4>GreedyBaby</h4><small>Pick your foods</small><span class="pl">Play</span>
    </button>
   </div>

     </main>

   </div>

 <!-- GAME SCREEN -->
 <section class="game" id="gv" aria-label="Game">
  <header class="gh">
   <img id="gl" class="gl" alt="" src="assets/super77pro.webp" width="36" height="36">
   <div class="wal"><i class="coin" aria-hidden="true"></i><span class="bal" aria-label="Wallet balance">0</span></div>
   <button class="x" id="info" aria-label="Rules and paytable"><svg class="ui"><use href="#u-info"/></svg></button>
   <button class="x" id="sb" aria-label="Sound"><svg class="ui"><use href="#u-sound"/></svg></button>
   <button class="x" id="close" aria-label="Close game"><svg class="ui"><use href="#u-close"/></svg></button>
  </header>
  <div class="gb" id="gb"></div>
 </section>

 <!-- WALLET / PROFILE PANEL -->
 <section class="pv" id="pv" aria-label="Panel">
  <header class="gh">
   <button class="x" id="pc" aria-label="Back to home"><svg class="ui"><use href="#u-back"/></svg></button>
   <h2 id="pt">Wallet</h2>
  </header>
  <div class="gb" id="pb"></div>
 </section>
</div>

<!-- Dialog (confirmations, paytable/rules) -->
<div class="modal" id="modal" hidden>
 <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-t" tabindex="-1">
  <header><h3 id="modal-t"></h3><button class="x sm" id="modal-x" aria-label="Close dialog"><svg class="ui"><use href="#u-close"/></svg></button></header>
  <div class="modal-b" id="modal-b"></div>
  <footer id="modal-f"></footer>
 </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/sprite.js"></script>
<script src="js/core.js"></script>
<script src="js/fx.js"></script>
<script src="js/rules.js"></script>
<script src="js/wheel.js"></script>
<script src="js/greedy.js"></script>
</body>
</html>

name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html style.css script.js www/

      - name: Install Capacitor
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Set app logo (APK icon)
        run: |
          LOGO="APK_Logo_512x512_Transparent.png"
          RES="android/app/src/main/res"
          command -v convert >/dev/null || sudo apt-get install -y imagemagick
          for d in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $d
            mkdir -p "$RES/mipmap-$1"
            convert "$LOGO" -resize "${2}x${2}" "$RES/mipmap-$1/ic_launcher.png"
            cp "$RES/mipmap-$1/ic_launcher.png" "$RES/mipmap-$1/ic_launcher_round.png"
            INNER=$(( $3 * 72 / 108 ))
            convert "$LOGO" -resize "${INNER}x${INNER}" -background none -gravity center -extent "${3}x${3}" "$RES/mipmap-$1/ic_launcher_foreground.png"
          done
          mkdir -p "$RES/values"
          cat > "$RES/values/ic_launcher_background.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#011B4C</color>
          </resources>
          XML

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-cash-user-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
